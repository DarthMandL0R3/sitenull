baseURL: "https://abrarkhalish.com/"
locale: "en-us"
title: "Abrar Khalish | Cloud DevOps Engineer"

# Build settings
build:
  writeStats: true

# Enable emoji
enableEmoji: true

# Disable robots.txt for now
enableRobotsTXT: false

# Minify output
minify:
  disableXML: true

# Taxonomies
taxonomies:
  tag: tags
  category: categories

# Markup settings
markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
  highlight:
    noClasses: false

# Params
params:
  title: "Abrar Khalish"
  description: "Cloud DevOps Engineer - Azure, Kubernetes, Terraform, CI/CD"
  author: "Abrar Khalish Kamarulzaman"
  defaultTheme: dark
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  # Social icons
  socialIcons:
    - name: github
      url: "https://github.com/DarthMandL0R3"
    - name: linkedin
      url: "https://www.linkedin.com/in/abrarkhalish/"

  # Home page params
  homeInfoParams:
    Title: "Hello, I'm Abrar"
    Content: "Cloud DevOps Engineer specializing in Azure automation, Kubernetes orchestration, and Infrastructure as Code."

# Menu
menu:
  main:
    - identifier: home
      name: Home
      url: /
      weight: 10
    - identifier: tech-stack
      name: Tech Stack
      url: /tech-stack/
      weight: 20
    - identifier: projects
      name: Projects
      url: /projects/
      weight: 30
    - identifier: certifications
      name: Certifications
      url: /certifications/
      weight: 40
    - identifier: experience
      name: Experience
      url: /experience/
      weight: 50
    - identifier: contact
      name: Contact
      url: /contact/
      weight: 60

# Output formats
outputs:
  home:
    - HTML
    - RSS
