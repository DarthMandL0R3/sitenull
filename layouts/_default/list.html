{{ define "main" }}
<div style="padding: 2rem 0;">
    <h1 style="font-size: 2.25rem; font-weight: 700; color: var(--color-text-primary); margin-bottom: 2rem;">{{ .Title }}</h1>
    
    {{ .Content }}
    
    {{ range .Pages }}
    <div class="card" style="margin-bottom: 1rem;">
        <a href="{{ .RelPermalink }}" style="display: block; text-decoration: none;">
            <h2 style="font-size: 1.25rem; font-weight: 600; color: var(--color-text-primary); transition: color 0.2s;"
                onmouseover="this.style.color='var(--color-accent-cyan)'" onmouseout="this.style.color='var(--color-text-primary)'">
                {{ .Title }}
            </h2>
            <p style="color: var(--color-text-secondary); margin-top: 0.5rem;">{{ .Description }}</p>
        </a>
    </div>
    {{ end }}
</div>
{{ end }}
